<svg width="100%" viewBox="0 0 680 450" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect class="bg" x="0" y="0" width="680" height="450"/>
<style>
